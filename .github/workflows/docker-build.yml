name: Build and push Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/capstonehub:latest
            ghcr.io/${{ github.repository_owner }}/capstonehub:${{ github.sha }}

      - name: Verify native tesseract in built image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/capstonehub:${{ github.sha }}
          echo "Pulling image $IMAGE"
          docker pull "$IMAGE"
          echo "Checking tesseract --version inside image"
          docker run --rm "$IMAGE" tesseract --version

      - name: Optional: Deploy to Railway
        if: ${{ secrets.RAILWAY_API_KEY != '' && secrets.RAILWAY_SERVICE_ID != '' }}
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          echo "Installing Railway CLI..."
          npm i -g @railway/cli
          echo "Logging into Railway..."
          railway login --apiKey "$RAILWAY_API_KEY"
          echo "Triggering redeploy for service $RAILWAY_SERVICE_ID"
          railway service redeploy --service "$RAILWAY_SERVICE_ID" --yes
